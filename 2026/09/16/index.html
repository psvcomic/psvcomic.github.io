	<img class="comic c6Paneled" alt="A 6 panel grayscale comic featuring Jack from Jack and the Beanstalk and his mother in their dingy house. A broken window looking out into their yard is visible between them.

Mom, solemnly: Jack, you&#39;re back. Did you get a good price for the cow?
Jack, cheerily: Better. I traded Betsy for some magic beans!
Panel 2.
Mom, angrily: You did what!
Jack: Then I realized I&#39;d already traded one item for another of greater value. I couldn&#39;t stop there!
Panel 3.
We cut to a panel showing Jack standing in front of piles of treasure. A glowing sword and crown over in the air around him.
Jack: I kept trading. Jewels, swords, castles! Wealth and power flowed through my fingers and I couldn&#39;t stop!
Panel 4.
Close up on Jack standing in a dark void holding a magic lamp. He&#39;s looking up into a shining light.
Jack, narrating: Finally, I achieved the ultimate prize. A magic lamp. And a single wish.
Panel 5.
Close up on Jack back in the house looking sad.
Jack: There, at the apex of my journey I realized that for all the wonders I&#39;d held my heart was hollow. And I wished for the one thing that could bring joy back into my life.
Panel 6.
Back to the framing of the first panel. A cow is now visible through the window.
Jack, cheerily: I wished for my friend Betsy back!
Mom, frustrated: God dammit Jack!" src="/assets/images/comics/2026/09/16/FullComic.png" />
