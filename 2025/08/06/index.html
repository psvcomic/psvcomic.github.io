	<img class="comic cSquare" alt="A 4 panel black, white, and grey comic.
Panel 1.
The night sky appears with scattered stars. Over it is the text: I&#39;ve always lived in a city with light pollution. Still, when I was young I could look up and see stars. 
Panel 2.
The stars are mostly gone. Only a few linger at the top of the panel. Over it is the text: But cities change. The skies of my youth disappeared years ago. It&#39;s been years since I last saw a star.
Panel 3.
A silhouette of the a man standing on a hill has been added over the blank void. Over it is the text: I used to wonder what it would be like at the end of time. After all the stars burned out. To look up and see only blank, hungry void.
Panel 4.
A city has been added looming over the hill, casting light into the sky. Over it is the text: Today, many of us already do." src="/assets/images/comics/2025/08/06/FullComic.png" />
